title: Risk and Reliability for Engineers
author: Robert Lanzafame
logo: figures/cover_small.png
copyright: Delft University of Technology, CC BY 4.0 # overriden by extra footer/sphinx config

execute:
  execute_notebooks: "off"

launch_buttons:
  thebe: true

only_build_toc_files: true

repository:
  url: https://github.com/prob-design/risk-reliability
  branch: main

html:
  use_edit_page_button: false
  use_repository_button: true
  extra_footer: |
      <p>
        © Delft University of Technology, CC BY 4.0
        <img src="https://gitlab.tudelft.nl/interactivetextbooks-citg/risk-and-reliability/-/raw/publish-tud-open-textbook/book/images/TUDelft_logo_rgb.png?ref_type=heads" width="88px">
        <a rel="license" href="http://creativecommons.org/licenses/by/4.0/">
          <img alt="Creative Commons License" style="border-width:; width:80px; height:auto; padding-top:0px" src="https://i.creativecommons.org/l/by/4.0/88x31.png" />
        </a>
      </p>
sphinx:
  config:
    html_show_copyright: false
    html_js_files:
    - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    thebe_config:
      use_thebe_lite: true
      exclude_patterns: ["**/_*.yml", "**/*.md", "**/*.ipynb"]
  extra_extensions:
    - sphinx.ext.imgconverter
    - download_link_replacer
    - jupyterbook_patches

bibtex_bibfiles: 
  - _bibliography/references.bib
